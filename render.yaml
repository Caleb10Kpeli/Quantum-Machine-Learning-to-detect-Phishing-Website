services:
  - name: qml-phishing-detector
    type: web
    runtime: python
    plan: free
    rootDir: flask_app
    buildCommand: pip install -r ../requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: FLASK_DEBUG
        value: "0"
